when:
  - event: cron
    cron: template-sync

steps:
  - name: UPDATE-REPOSITORIES
    image: bash
    environment:
      GIT_AUTHOR_EMAIL: bot@jruz.io
      GIT_AUTHOR_NAME: Woodpecker Bot
      GIT_COMMITTER_EMAIL: bot@jruz.io
      GIT_COMMITTER_NAME: Woodpecker Bot
      GITHUB_TOKEN:
        from_secret: GITHUB_TOKEN
    commands:
      - nix develop --command gh release download --repo jruz/template-sync --pattern template-sync-unknown-linux-musl-x86_64 --output tmp/template-sync --clobber
      - chmod +x tmp/template-sync
      - nix develop --command tmp/template-sync update-repositories --account jruz
